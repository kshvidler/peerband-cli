name: release
# Releases run automatically when a version bump lands on main: a push to main
# that changes package.json releases its version if the tag v<version> does not
# exist yet (any other push to main is a no-op after a few seconds). It can also
# be run by hand from main with the version already in package.json.
#
# A tag push is deliberately NOT a trigger: the release tag points at a commit
# that contains the built dist/ (which is gitignored on main), so the tag is
# created by this workflow, and a workflow that reacted to its own tag push
# would loop or race.
#
# npm trusted publishing (OIDC) is bound to this file name: keep it release.yml.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must equal package.json version, e.g. 0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this version still needs a release
        id: plan
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "$version" ]; then
            echo "::error::Requested version $REQUESTED does not match package.json version $version"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            if [ -n "$REQUESTED" ]; then echo "::error::Tag v$version already exists"; exit 1; fi
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  verify:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
  tag:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit dist/ on a detached HEAD and push only the tag
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add -f dist
          git commit -m "Release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "refs/tags/v$VERSION"
  publish:
    needs: [plan, tag]
    # Trusted publishing needs a public repository (npm provenance requirement).
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.plan.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      # No NPM_TOKEN: npm trusted publishing (OIDC) authenticates this job and
      # attaches provenance automatically.
      - run: npm publish --access public
  github-release:
    needs: [plan, tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.plan.outputs.version }}
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          (cd install && sha256sum install.sh install.ps1) > SHA256SUMS
          cat SHA256SUMS
          gh release create "v$VERSION" install/install.sh install/install.ps1 SHA256SUMS \
            --title "PeerBand v$VERSION" --generate-notes --verify-tag
  notice:
    needs: [plan, tag]
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "::notice title=npm publish skipped::The repository is private, so the publish job was skipped. Make the repository public and re-run to publish."
