name: ci
# Economical by design (GitHub free tier): one Linux job on the minimum supported
# Node per push to main. Run `npm run check` locally before pushing; it also runs
# the PowerShell installer tests, which CI skips. Windows/macOS are manual and
# single-job only (macOS minutes bill at 10x, Windows at 2x on private repos).
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", "NOTICE"]
  workflow_dispatch:
    inputs:
      os:
        description: Runner to check on (one job)
        type: choice
        options: [ubuntu-latest, windows-latest, macos-latest]
        default: ubuntu-latest
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - name: ShellCheck the installer
        if: runner.os == 'Linux'
        run: shellcheck install/install.sh
